name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag and theme versions
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const theme = JSON.parse(fs.readFileSync('komari-theme.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${pkg.version}` || theme.version !== pkg.version) {
            throw new Error('Release tag, package.json and komari-theme.json versions must match');
          }
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tagged = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim();
          if (head !== tagged) throw new Error('Checkout does not match release tag');
          const archive = `${theme.short}-v${theme.version}.zip`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\narchive=${archive}\n`);
          NODE

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build and package
        run: pnpm run package

      - name: Generate SHA-256 checksum
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: sha256sum "$ARCHIVE" > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: komari_TacitSoul主题 ${{ steps.version.outputs.tag }}
          body_path: RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.version.outputs.archive }}
            SHA256SUMS.txt
