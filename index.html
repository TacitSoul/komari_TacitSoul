<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use env(safe-area-inset-*) for the notch / home-indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool.">

    <!-- ── PWA / favicons ──────────────────────────────────────────────
         theme-color is overwritten at runtime by useTheme to match the
         current visual theme (clean → light, deepspace → dark);
         the static value is the deepspace background as a sensible
         pre-hydration default. -->
    <!-- Komari owns this icon; do not override it with theme SVGs. -->
    <link rel="icon" href="/favicon.ico?v=1.0.0" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Komari" />
    <meta name="format-detection" content="telephone=no" />

    <!-- UI fonts use the local Microsoft YaHei-first stack; no webfont download. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
